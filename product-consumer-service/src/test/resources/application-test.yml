spring:
  datasource:
    url: jdbc:h2:mem:grupoasd_prod_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS grupoasd_prod
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: grupoasd_prod
        hbm2ddl:
          create_namespaces: false
  activemq:
    broker-url: vm://localhost?broker.persistent=false
    user: admin
    password: admin

logging:
  file:
    name: target/test-logs/product-consumer-test.log

app:
  messaging:
    queues:
      producto-registro: test.grupoasd.productos.registro.queue
      producto-notificacion: test.grupoasd.productos.notificacion.queue
      dead-letter-queue: ActiveMQ.DLQ
    redelivery:
      maximum-redeliveries: 2
      initial-redelivery-delay-ms: 100
      backoff-multiplier: 1.0
      use-exponential-backoff: false
